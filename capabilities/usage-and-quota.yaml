apiVersion: naftiko.io/v1
kind: Capability
metadata:
  name: usage-and-quota
  version: 1.0.0-alpha2
  labels:
    provider: parseflow
    family: usage
    domain: document-ai
spec:
  title: Usage and Quota
  description: |
    Read the current API key's identity, monthly quota consumption, and recent
    usage statistics. Use this before high-volume runs to avoid 429
    MONTHLY_USAGE_EXCEEDED errors.
  sharedAPI:
    $ref: ./shared/parseflow-api.yaml
  operations:
    - name: get-key-info
      consume:
        http:
          method: GET
          path: /v2/me
    - name: get-usage
      consume:
        http:
          method: GET
          path: /v2/usage
    - name: get-stats
      consume:
        http:
          method: GET
          path: /v2/stats
    - name: health
      consume:
        http:
          method: GET
          path: /v2/health
  expose:
    rest:
      path: /capabilities/usage-and-quota
    mcp:
      tools:
        - parseflow_get_key_info
        - parseflow_get_usage
        - parseflow_get_stats
        - parseflow_health
  outputs:
    contentType: application/json
