apiVersion: naftiko.io/v1
kind: SharedAPI
metadata:
  name: parseflow-api
  version: 1.0.0-alpha2
  labels:
    provider: parseflow
    domain: document-ai
spec:
  description: |
    Shared connection definition for the Parseflow document parsing, extraction,
    and search API. Used by every Parseflow capability via $ref.
  baseURL: https://parseflow-api.thankfulisland-fec0f8f2.westus2.azurecontainerapps.io
  openapi: ../../openapi/parseflow-openapi.json
  auth:
    type: apiKey
    in: header
    name: X-API-Key
    description: |
      Parseflow API key issued via Whop checkout. Send on every request as the
      X-API-Key header. Keys begin with the `pfk_` prefix.
    secretRef:
      name: PARSEFLOW_API_KEY
  optionalHeaders:
    - name: X-BYOK-Key
      description: Caller-supplied provider key (OpenAI/Anthropic/Google) for byok_assisted mode.
      secretRef:
        name: PARSEFLOW_BYOK_KEY
    - name: X-Client-Id
      description: Optional client identifier for usage attribution.
    - name: Idempotency-Key
      description: Idempotency token for safe retries on /v2/process.
  defaultTimeoutSeconds: 60
  retries:
    attempts: 3
    backoff: exponential
    retryOn:
      - 429
      - 502
      - 503
      - 504
  errorMapping:
    "400": invalid_request
    "401": unauthorized
    "413": payload_too_large
    "422": validation_error
    "429": rate_limited
    "504": upstream_timeout
